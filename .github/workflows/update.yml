name: "Update"

on:
  schedule:
    - cron: '8 */4 * * *' # At minute 8 past every 4th hour
  workflow_dispatch:  

jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt install -y whois gawk dnsutils jq

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('utils/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r utils/requirements.txt

      - name: Download IPs
        run: |
          set -euo pipefail
          set -x
          find . -name downloader.sh | sort -h | awk '{print "Executing "$1"...";system("bash "$1)}'

      - name: Create All-In-One ranges
        run: |
          set -euo pipefail
          # Aggregate provider lists only (mindepth 2), excluding all/ itself and
          # the unused root-level legacy files — otherwise stale IPs and a removed
          # provider's IPs would linger in the aggregate forever.
          find . -mindepth 2 -name ipv4.txt -not -path './all/*' -exec cat {} + | sort -V | uniq > all/ipv4.txt
          find . -mindepth 2 -name ipv6.txt -not -path './all/*' -exec cat {} + | sort -V | uniq > all/ipv6.txt

      - name: Merge ipv4 Ranges
        run: |
          set -euo pipefail
          find . -mindepth 2 -name ipv4.txt | sort -h | while read -r f; do
            echo "Merging $f"
            python utils/merge.py --source="$f" | sort -V > "${f%.txt}_merged.txt"
          done

      - name: Merge ipv6 Ranges
        run: |
          set -euo pipefail
          find . -mindepth 2 -name ipv6.txt | sort -h | while read -r f; do
            echo "Merging $f"
            python utils/merge.py --source="$f" | sort -V > "${f%.txt}_merged.txt"
          done

      - name: Lint Python
        run: ruff check .

      - name: Validate CIDR lists
        run: python utils/validate.py

      - name: Render README
        run: python utils/render_readme.py

      - name: Commit files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote add github "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull github "${GITHUB_REF}" --ff-only

          # Use current user's credentials instead of original author
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --local user.name "${GITHUB_ACTOR}"

          # try commit
          git add .
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "Auto-update ip ranges"

          # push changes
          git push github "HEAD:${GITHUB_REF}"